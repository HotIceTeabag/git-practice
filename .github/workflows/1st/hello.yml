name: Shell Commend
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check environment #step1의 id
        run: |
          echo "Current directory:"
          pwd
          echo "File list: "
          ls -la
        
      - name: Check File
        run: |
          if [ -f "README.md" ]; then
            echo "File exists"
          else
            echo "File not found"
          fi # if를 닫는건 fi(if거꾸로)

      - name: Repeat commands
        run: |
          for i in 1 2 3
          do
            echo "Test $i"
          done

      - name: Use environment variable
        env:
          MESSAGE: Hello!!
        run: echo "$MESSAGE"